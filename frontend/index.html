<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CPQ Demo System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root { 
      --azure-blue: #0078d4; 
      --azure-dark: #005a9e;
      --bg: #f3f2f1; 
      --text: #323130;
    }
    
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }

    /* --- Navigation --- */
    nav {
      background: var(--azure-dark);
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .nav-logo { font-weight: 600; font-size: 18px; }
    .menu-icon { display: none; cursor: pointer; font-size: 24px; }

    .lang-switcher { display: flex; gap: 8px; }
    .lang-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 4px 10px;
      cursor: pointer;
      border-radius: 2px;
      font-size: 12px;
    }
    .lang-btn.active { background: white; color: var(--azure-dark); border-color: white; }

    /* --- Layout --- */
    .container { 
      max-width: 1000px; 
      margin: 20px auto;
      background: white; 
      box-shadow: 0 1.6px 3.6px 0 rgba(0,0,0,0.132);
      display: flex;
      flex-direction: column;
    }

    .cpq-grid { display: flex; flex-direction: column; }
    @media (min-width: 768px) { .cpq-grid { flex-direction: row; } }

    .config-section { flex: 1; padding: 25px; }
    .summary-section { flex: 0 0 320px; background: #faf9f8; padding: 25px; border-left: 1px solid #edebe9; }

    /* Mobile Menu */
    @media (max-width: 767px) {
      .menu-icon { display: block; }
      .lang-switcher {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 50px;
        right: 0;
        background: var(--azure-dark);
        width: 100%;
        padding: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      }
      .lang-switcher.show { display: flex; }
      .summary-section { border-left: none; border-top: 1px solid #edebe9; }
    }

    /* Form Components */
    h3 { margin-top: 0; border-bottom: 1px solid #edebe9; padding-bottom: 10px; font-weight: 600; }
    label { display: block; margin-top: 18px; font-weight: 600; font-size: 14px; }
    select, input, textarea { 
      width: 100%; padding: 10px; margin-top: 8px; 
      border: 1px solid #8a8886; box-sizing: border-box; 
      border-radius: 2px; font-size: 16px;
    }
    .price-card { background: white; border: 1px solid #edebe9; padding: 20px; text-align: center; margin: 20px 0; }
    .price-value { font-size: 32px; color: var(--azure-blue); font-weight: 700; }
    .btn-submit { 
      width: 100%; padding: 12px; background: var(--azure-blue); 
      color: white; border: none; font-weight: 600; cursor: pointer;
    }
    .btn-submit:hover { background: var(--azure-dark); }
    .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
    .warning { color: #a4262c; background: #fed9cc; padding: 10px; font-size: 13px; margin-top: 10px; display: none; border-radius: 2px; }
    #loading-overlay { padding: 50px; text-align: center; font-weight: bold; color: var(--azure-blue); }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">CPQ Demo System</div>
  <div class="menu-icon" onclick="toggleMenu()">☰</div>
  <div class="lang-switcher" id="langMenu">
    <button class="lang-btn active" id="btn-en" onclick="changeLang('en')">English</button>
    <button class="lang-btn" id="btn-jp" onclick="changeLang('jp')">日本語</button>
    <button class="lang-btn" id="btn-th" onclick="changeLang('th')">ไทย</button>
  </div>
</nav>

<div class="container">
  <div id="loading-overlay">Connecting to Azure...</div>
  
  <form id="cpqForm" class="cpq-grid" style="display: none;">
    <div class="config-section">
      <h3 id="t-title">Configuration</h3>
      
      <label id="t-name">Name</label>
      <input type="text" name="name" required placeholder="Enter name">

      <label id="t-category">Category</label>
      <select id="category" name="category"></select>

      <label id="t-plan">Selection</label>
      <select id="plan" name="plan"></select>
      
      <label id="t-segment">Segment</label>
      <select id="identity" name="identity"></select>
      
      <div id="warn" class="warning"></div>

      <label id="t-notes">Notes</label>
      <textarea name="notes" rows="2" placeholder="Special requirements..."></textarea>
    </div>

    <div class="summary-section">
      <h3 id="t-livequote">Quotation</h3>
      <div class="price-card">
        <div class="price-label" id="t-total">Total Amount</div>
        <div class="price-value">฿ <span id="totalDisplay">0</span></div>
      </div>
      
      <div>
        <p><strong id="t-details">Details:</strong></p>
        <ul id="benefits" style="font-size: 13px; color: #605e5c; padding-left: 20px;"></ul>
      </div>

      <button type="submit" class="btn-submit" id="t-submit">Submit Quote</button>
      <p id="submit-status" style="font-size: 12px; text-align: center; margin-top: 10px; display: none;"></p>
    </div>
  </form>
</div>

<script>
  // ✅ 恢复为你真实的 Azure 路径
  const API_URL = "https://web-cpq-api-hufgbkfvbceyb3cj.malaysiawest-01.azurewebsites.net/api.php";
  const CONFIG_API = API_URL + "?type=cpq";
  const ORDER_API = API_URL + "?type=orders";

  let catalog = {};
  let currentLang = 'en';

  const uiLabels = {
    en: { title: "Configuration", name: "Name", category: "Category", plan: "Selection", segment: "Segment", notes: "Notes", livequote: "Quotation", total: "Total", details: "Details", submit: "Submit Quote", warn: "⚠️ Weekday Special is for Junior/Senior/Ladies only.", segs: { regular: "Adult (Regular)", junior: "Junior", senior: "Senior", ladies: "Ladies" } },
    jp: { title: "構成設定", name: "お名前", category: "区分", plan: "プラン選択", segment: "属性", notes: "備考", livequote: "お見積り", total: "合計金額", details: "プラン内容", submit: "見積もり送信", warn: "⚠️ 平日プランはジュニア・シニア・レディース限定です。", segs: { regular: "一般大人", junior: "ジュニア", senior: "シニア", ladies: "レディース" } },
    th: { title: "การกำหนดค่า", name: "ชื่อ", category: "ประเภท", plan: "การเลือก", segment: "ลูกค้า", notes: "หมายเหตุ", livequote: "ใบเสนอราคา", total: "ยอดรวม", details: "รายละเอียด", submit: "ส่งใบเสนอราคา", warn: "⚠️ สำหรับเด็ก/ผู้สูงอายุ/สตรีเท่านั้น", segs: { regular: "ผู้ใหญ่ปกติ", junior: "เด็ก", senior: "ผู้สูงอายุ", ladies: "สตรี" } }
  };

  async function init() {
    try {
      const response = await fetch(CONFIG_API);
      if (!response.ok) throw new Error();
      const data = await response.json();
      catalog = data.catalog;
      document.getElementById('loading-overlay').style.display = 'none';
      document.getElementById('cpqForm').style.display = 'flex';
      renderUI();
    } catch (err) {
      document.getElementById('loading-overlay').innerHTML = "❌ Error connecting to API.";
    }
  }

  function toggleMenu() { document.getElementById('langMenu').classList.toggle('show'); }

  function changeLang(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`btn-${lang}`).classList.add('active');
    renderUI();
    if(window.innerWidth < 768) document.getElementById('langMenu').classList.remove('show');
  }

  function renderUI() {
    const d = uiLabels[currentLang];
    document.getElementById('t-title').innerText = d.title;
    document.getElementById('t-name').innerText = d.name;
    document.getElementById('t-category').innerText = d.category;
    document.getElementById('t-plan').innerText = d.plan;
    document.getElementById('t-segment').innerText = d.segment;
    document.getElementById('t-notes').innerText = d.notes;
    document.getElementById('t-livequote').innerText = d.livequote;
    document.getElementById('t-total').innerText = d.total;
    document.getElementById('t-details').innerText = d.details;
    document.getElementById('t-submit').innerText = d.submit;
    document.getElementById('warn').innerText = d.warn;

    const catEl = document.getElementById('category');
    const savedCat = catEl.value;
    catEl.innerHTML = Object.keys(catalog).map(key => `<option value="${key}">${catalog[key][currentLang]}</option>`).join('');
    if(catalog[savedCat]) catEl.value = savedCat;

    const segEl = document.getElementById('identity');
    segEl.innerHTML = Object.entries(d.segs).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
    updatePrices();
  }

  function updatePrices() {
    const cat = document.getElementById('category').value;
    const planEl = document.getElementById('plan');
    const items = catalog[cat].items;
    const prevPlan = planEl.value;
    planEl.innerHTML = Object.keys(items).map(k => `<option value="${k}">${k.replace(/_/g,' ').toUpperCase()}</option>`).join('');
    if(items[prevPlan]) planEl.value = prevPlan;
    
    const isRestricted = (cat === 'weekday' && document.getElementById('identity').value === 'regular');
    if (isRestricted) {
      document.getElementById('warn').style.display = 'block';
      document.getElementById('totalDisplay').innerText = "N/A";
    } else {
      document.getElementById('warn').style.display = 'none';
      const price = items[planEl.value];
      document.getElementById('totalDisplay').innerText = price ? price.toLocaleString() : "0";
    }
    document.getElementById('benefits').innerHTML = catalog[cat].benefits.map(b => `<li>${b}</li>`).join('');
  }

  [document.getElementById('category'), document.getElementById('identity'), document.getElementById('plan')].forEach(el => el.addEventListener('change', updatePrices));

  document.getElementById('cpqForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (document.getElementById('totalDisplay').innerText === "N/A") return;

    const btn = document.getElementById('t-submit');
    const status = document.getElementById('submit-status');
    btn.disabled = true;
    status.style.display = "block";
    status.innerText = "Sending...";

    const data = Object.fromEntries(new FormData(e.target).entries());
    data.totalPrice = document.getElementById('totalDisplay').innerText;

    try {
      const res = await fetch(ORDER_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
      if (res.ok) {
        status.innerText = "Success ✓";
        e.target.reset();
        updatePrices();
      }
    } catch (err) {
      status.innerText = "Error";
    } finally {
      btn.disabled = false;
    }
  });

  init();
</script>
</body>
</html>
