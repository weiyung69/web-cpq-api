<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Quote System</title>
    <style>
        :root { --primary: #0078d4; --bg: #f3f2f1; }
        body { font-family: -apple-system, 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .app-container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .brand { text-align: center; font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 25px; }
        
        /* 语言选择 */
        .lang-bar { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; }
        .lang-btn { border: 1px solid #ddd; background: white; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; }
        .lang-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: bold; }

        .section-title { font-size: 14px; font-weight: bold; margin: 25px 0 12px; display: flex; align-items: center; }
        .section-title::after { content: ""; flex: 1; height: 1px; background: #eee; margin-left: 10px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { border: 2px solid #f0f0f0; padding: 16px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s; background: #fafafa; }
        .card.active { border-color: var(--primary); background: #f0f7ff; color: var(--primary); font-weight: bold; }

        input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px; }
        
        .footer-price { margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .price-val { font-size: 24px; font-weight: 800; color: #000; }

        .submit-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="brand" class="brand">--</div>
    <div class="lang-bar" id="langs"></div>

    <div class="section-title" id="t-info">Personal Info</div>
    <input type="text" id="cust-name" placeholder="Name">
    <input type="text" id="cust-phone" placeholder="Phone">

    <div class="section-title" id="t-seg">Identity</div>
    <div class="grid" id="seg-grid"></div>

    <div class="section-title" id="t-cat">Service Plan</div>
    <div class="grid" id="cat-grid"></div>

    <div class="footer-price">
        <div id="t-total">Total Amount</div>
        <div class="price-val" id="display-price">--</div>
    </div>

    <button class="submit-btn" id="btn-submit" onclick="doSubmit()" disabled>Generate & Print Quote</button>
</div>

<script>
    const API = "https://web-cpq-api-hufgbkfvbceyb3cj.malaysiawest-01.azurewebsites.net/api.php";
    let db = { cpq: null, langs: null };
    let state = { lang: 'en', seg: null, cat: null };

    async function init() {
        const t = Date.now();
        const [r1, r2] = await Promise.all([
            fetch(`${API}?type=cpq&t=${t}`),
            fetch(`${API}?type=langs&t=${t}`)
        ]);
        db.cpq = await r1.json();
        db.langs = await r2.json();
        state.lang = db.cpq.settings.langs[0];
        renderLangs();
        updateUI();
    }

    function t(key) { return (db.langs[key] && db.langs[key][state.lang]) ? db.langs[key][state.lang] : key; }

    function renderLangs() {
        document.getElementById('langs').innerHTML = db.cpq.settings.langs.map(l => 
            `<button class="lang-btn ${l===state.lang?'active':''}" onclick="changeLang('${l}')">${l.toUpperCase()}</button>`
        ).join('');
    }

    function changeLang(l) { state.lang = l; renderLangs(); updateUI(); }

    function updateUI() {
        document.getElementById('brand').innerText = db.cpq.settings.brand_name;
        document.getElementById('t-info').innerText = t('UI_NAME_LABEL');
        document.getElementById('cust-name').placeholder = t('UI_NAME_LABEL');
        document.getElementById('cust-phone').placeholder = t('UI_PHONE_LABEL');
        document.getElementById('t-seg').innerText = t('UI_SELECT_TYPE');
        document.getElementById('t-cat').innerText = t('UI_SELECT_PLAN');
        document.getElementById('t-total').innerText = t('UI_TOTAL');
        document.getElementById('btn-submit').innerText = t('UI_SUBMIT');

        // 渲染身份 (SEG_)
        const segs = new Set();
        Object.values(db.cpq.catalog).forEach(p => p.segments.filter(s=>s.startsWith('SEG_')).forEach(s=>segs.add(s)));
        document.getElementById('seg-grid').innerHTML = Array.from(segs).map(s => `
            <div class="card ${state.seg===s?'active':''}" onclick="select('seg', '${s}')">${t(s)}</div>
        `).join('');

        // 渲染服务 (CAT_) - 根据所选 SEG 过滤
        const cats = Object.values(db.cpq.catalog).filter(p => !state.seg || p.segments.includes(state.seg));
        document.getElementById('cat-grid').innerHTML = cats.map(p => `
            <div class="card ${state.cat===p.i18n?'active':''}" onclick="select('cat', '${p.i18n}')">${t(p.i18n)}</div>
        `).join('');

        calcPrice();
    }

    function select(type, val) {
        state[type] = val;
        if(type === 'seg') state.cat = null;
        updateUI();
    }

    function calcPrice() {
        const display = document.getElementById('display-price');
        const btn = document.getElementById('btn-submit');
        if(state.seg && state.cat) {
            const prod = Object.values(db.cpq.catalog).find(p => p.i18n === state.cat && p.segments.includes(state.seg));
            if(prod) {
                display.innerText = db.cpq.settings.currency + " " + Object.values(prod.items)[0].toLocaleString();
                btn.disabled = false;
                return;
            }
        }
        display.innerText = "--";
        btn.disabled = true;
    }

    async function doSubmit() {
    // 找到当前选中的产品对象，用来抓取具体的 Item 名字
    const prod = Object.values(db.cpq.catalog).find(p => p.i18n === state.cat && p.segments.includes(state.seg));
    const itemName = prod ? Object.keys(prod.items)[0] : ""; // 拿到第一个 Price Slot 的名字

    const order = {
        name: document.getElementById('cust-name').value,
        phone: document.getElementById('cust-phone').value, // 确保存入电话
        seg: t(state.seg), // 存入翻译后的身份文字
        cat: t(state.cat) + (itemName ? " (" + itemName + ")" : ""), // 存入翻译后的产品+具体项目名
        price: document.getElementById('display-price').innerText,
        status: "pending", // 初始状态：待跟进
        date: new Date().toISOString()
    };

    if(!order.name || !order.phone) return alert("Please enter name and contact");

    // 1. 打印
    printPDF(order);
    
    // 2. 存入后台 (这里会发送完整的 order 对象，包含 phone 和 status)
    await fetch(`${API}?type=orders`, { method: 'POST', body: JSON.stringify(order) });
    alert(t('UI_SUCCESS') || "Success!");
}

          function printPDF(o) {
    const w = window.open('', '_blank');
    
    // 1. 预先获取当前语言下的翻译结果
    const translatedCat = t(o.cat);
    const translatedSeg = t(o.seg);
    const translatedTotalLabel = t('UI_TOTAL') || 'TOTAL';
    const translatedNameLabel = t('UI_NAME_LABEL') || 'Customer';
    const translatedPhoneLabel = t('UI_PHONE_LABEL') || 'Contact';
    
    // 获取当前日期
    const today = new Date().toLocaleDateString();
    
    w.document.write(`
        <html>
        <head>
            <style>
                @page { size: A4; margin: 20mm; }
                body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #333; line-height: 1.5; }
                .header-center { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #333; padding-bottom: 10px; }
                .brand-name { font-size: 28px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
                .doc-type { font-size: 18px; color: #666; margin-top: 5px; }
                .info-section { display: flex; justify-content: space-between; margin-bottom: 40px; font-size: 14px; }
                .customer-info { line-height: 1.8; }
                .date-info { text-align: right; line-height: 1.8; }
                .label { color: #888; text-transform: uppercase; font-size: 11px; font-weight: bold; }
                table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
                th { background: #f4f4f4; text-align: left; padding: 12px; border-bottom: 2px solid #ddd; font-size: 13px; }
                td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }
                .text-right { text-align: right; }
                .total-section { text-align: right; margin-top: 20px; }
                .total-row { display: inline-block; width: 250px; }
                .total-amount { font-size: 22px; font-weight: bold; border-top: 2px solid #333; padding-top: 10px; margin-top: 10px; }
                .terms { margin-top: 60px; font-size: 11px; color: #777; border-top: 1px solid #eee; padding-top: 20px; }
                .terms-title { font-weight: bold; color: #333; margin-bottom: 5px; text-transform: uppercase; }
            </style>
        </head>
        <body>
            <div class="header-center">
                <div class="brand-name">${db.cpq.settings.brand_name}</div>
                <div class="doc-type">QUOTATION</div>
            </div>

            <div class="info-section">
                <div class="customer-info">
                    <div class="label">${translatedNameLabel}</div>
                    <strong>${o.name}</strong><br>
                    <div class="label" style="margin-top:10px;">${translatedPhoneLabel}</div>
                    ${o.phone || '-'}
                </div>
                <div class="date-info">
                    <div class="label">Date</div>
                    ${today}
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>DESCRIPTION</th>
                        <th class="text-right">AMOUNT</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <strong>${translatedCat}</strong><br>
                            <small style="color:#666">${translatedSeg} Plan</small>
                        </td>
                        <td class="text-right">${o.price}</td>
                    </tr>
                </tbody>
            </table>

            <div class="total-section">
                <div class="total-row">
                    <div class="total-amount">
                        <div style="display:flex; justify-content: space-between;">
                            <span>${translatedTotalLabel}</span>
                            <span>${o.price}</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="terms">
                <div class="terms-title">Terms & Conditions</div>
                1. This quotation is valid for 30 days from the date of issue.<br>
                2. Full payment is required before the commencement of the service.<br>
                3. Please contact us for any further clarification regarding this quote.
            </div>

            <script>
                window.onload = function() { 
                    window.print(); 
                };
            <\/script>
        </body>
        </html>
    `);
    w.document.close();
}

    init();
</script>
</body>
</html>
