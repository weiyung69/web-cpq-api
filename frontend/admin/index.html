<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      vertical-align: top;
    }
    th {
      background: #f5f5f5;
      text-align: left;
    }
    .status {
      font-weight: bold;
    }
    .action {
      color: green;
    }
    .no-action {
      color: #999;
    }
    @media (max-width: 600px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }
      th {
        display: none;
      }
      tr {
        margin-bottom: 15px;
        border: 1px solid #ddd;
        padding: 10px;
      }
      td {
        border: none;
        padding: 4px 0;
      }
      td::before {
        font-weight: bold;
        display: block;
      }
      td:nth-child(1)::before { content: "Time"; }
      td:nth-child(2)::before { content: "Name"; }
      td:nth-child(3)::before { content: "Email"; }
      td:nth-child(4)::before { content: "Plan"; }
      td:nth-child(5)::before { content: "Module"; }
      td:nth-child(6)::before { content: "Support"; }
      td:nth-child(7)::before { content: "Price"; }
      td:nth-child(8)::before { content: "Status"; }
    }
  </style>
</head>
<body>

<h1>Admin Portal</h1>
<p>Order list (read-only demo)</p>

<table id="ordersTable">
  <thead>
    <tr>
      <th>Time</th>
      <th>Name</th>
      <th>Email</th>
      <th>Plan</th>
      <th>Module</th>
      <th>Support</th>
      <th>Price</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  // ✅ BACKEND API BASE URL（真实 App Service）
  const API_URL = "https://web-api-demo-fdhgcjf2hscehjdd.malaysiawest-01.azurewebsites.net/api.php";

  async function loadOrders() {
    const res = await fetch(API_URL);
    const orders = await res.json();

    const tbody = document.querySelector("#ordersTable tbody");
    tbody.innerHTML = "";

    orders.reverse().forEach(order => {
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${order.time || "-"}</td>
        <td>${order.name}</td>
        <td>${order.email}</td>
        <td>${order.plan}</td>
        <td>${order.module}</td>
        <td>${order.support}</td>
        <td>USD ${order.totalPrice}</td>
        <td>
          <label>
            <input type="checkbox" onchange="toggleStatus(this)" />
            <span class="status no-action">Non‑action</span>
          </label>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function toggleStatus(checkbox) {
    const span = checkbox.nextElementSibling;
    if (checkbox.checked) {
      span.textContent = "Action";
      span.className = "status action";
    } else {
      span.textContent = "Non‑action";
      span.className = "status no-action";
    }

    // ✅ 之后如果你要把 status 写回 backend
    // fetch(API_URL, { method: "POST", body: ... })
  }

  loadOrders();
</script>

</body>
</html>
