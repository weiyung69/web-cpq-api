<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Global CPQ Expert Admin</title>
  <style>
    :root { --azure-blue: #0078d4; --bg: #f3f2f1; --border: #e1dfdd; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #323130; }
    .container { max-width: 1300px; margin: 0 auto; background: white; padding: 25px; border-radius: 2px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    
    /* Tabs */
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab-btn { padding: 12px 24px; cursor: pointer; border: none; background: none; font-weight: 600; color: #666; outline: none; }
    .tab-btn.active { color: var(--azure-blue); border-bottom: 3px solid var(--azure-blue); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Translation Center Table */
    .lang-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .lang-table th { background: #f8f9fa; text-align: left; padding: 10px; border: 1px solid var(--border); font-size: 13px; }
    .lang-table td { padding: 8px; border: 1px solid var(--border); }
    .lang-table input { width: 100%; padding: 5px; border: 1px solid transparent; box-sizing: border-box; }
    .lang-table input:focus { border: 1px solid var(--azure-blue); outline: none; background: #fff; }

    /* Product Cards */
    .cat-card { border: 1px solid var(--border); margin-bottom: 20px; padding: 15px; border-radius: 4px; }
    .cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #fafafa; padding: 10px; }
    .item-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f3f3f3; }
    
    .btn { padding: 8px 16px; cursor: pointer; border: none; font-weight: 600; font-size: 13px; border-radius: 2px; }
    .btn-blue { background: var(--azure-blue); color: white; }
    .btn-danger { background: #d13438; color: white; }
    .btn-ghost { background: #f3f2f1; color: #323130; }

    .save-footer { position: sticky; bottom: 0; background: white; padding: 20px; border-top: 2px solid var(--azure-blue); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
  </style>
</head>
<body>

<div class="container">
  <h2>Global Strategy Console</h2>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('langs')">1. Translation Center (改字)</button>
    <button class="tab-btn" onclick="switchTab('cpq')">2. Product & Logic (改价/规则)</button>
    <button class="tab-btn" onclick="switchTab('orders')">3. Orders</button>
  </div>

  <div id="panel-langs" class="tab-panel active">
    <p style="font-size: 13px; color: #666;">Define all labels here. These "Keys" will be used in Product Configuration.</p>
    <table class="lang-table">
      <thead>
        <tr id="lang-header-row"><th>Translation Key</th></tr>
      </thead>
      <tbody id="lang-body"></tbody>
    </table>
    <button class="btn btn-ghost" style="margin-top:10px;" onclick="addTranslationKey()">+ Add New Label Key</button>
  </div>

  <div id="panel-cpq" class="tab-panel">
    <div id="cpq-container"></div>
    <button class="btn btn-ghost" onclick="addCategory()">+ Add New Category</button>
  </div>

  <div id="panel-orders" class="tab-panel">
    <div id="orders-container">Order List (Same as before...)</div>
  </div>

  <div class="save-footer">
    <div>
      <label>Managed Languages: </label>
      <input type="text" id="supported-langs" placeholder="en,th,jp" style="padding:5px;">
    </div>
    <button class="btn btn-blue" style="padding:12px 40px;" onclick="saveAll()">SYNC ALL TO AZURE</button>
  </div>
</div>

<script>
  const API = "https://web-cpq-api-hufgbkfvbceyb3cj.malaysiawest-01.azurewebsites.net/api.php";
  let cpqData = {};
  let langData = {};
  let orders = [];

  async function init() {
    try {
      const [r1, r2, r3] = await Promise.all([
        fetch(API + "?type=cpq"),
        fetch(API + "?type=langs"),
        fetch(API + "?type=orders")
      ]);
      cpqData = await r1.json();
      langData = await r2.json();
      orders = await r3.json();
      
      document.getElementById('supported-langs').value = cpqData.settings.langs.join(',');
      renderLangs();
    } catch(e) { alert("Load Failed"); }
  }

  function switchTab(t) {
    document.querySelectorAll('.tab-btn, .tab-panel').forEach(el => el.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('panel-' + t).classList.add('active');
    if(t === 'langs') renderLangs();
    if(t === 'cpq') renderCPQ();
  }

  // --- Translation Center Logic ---
  function renderLangs() {
    const langs = cpqData.settings.langs;
    const header = document.getElementById('lang-header-row');
    header.innerHTML = '<th>Translation Key (Unique ID)</th>' + langs.map(l => `<th>${l.toUpperCase()}</th>`).join('');

    const body = document.getElementById('lang-body');
    body.innerHTML = "";
    for (let key in langData) {
      let row = `<tr><td><strong>${key}</strong></td>`;
      langs.forEach(l => {
        row += `<td><input type="text" value="${langData[key][l] || ''}" onchange="updateLangValue('${key}','${l}',this.value)"></td>`;
      });
      row += `</tr>`;
      body.innerHTML += row;
    }
  }

  function updateLangValue(key, lang, val) {
    if(!langData[key]) langData[key] = {};
    langData[key][lang] = val;
  }

  // --- Product Logic ---
  function renderCPQ() {
    const container = document.getElementById('cpq-container');
    container.innerHTML = "";
    const catalog = cpqData.catalog;

    for (let catKey in catalog) {
      const cat = catalog[catKey];
      // 这里的重点：显示翻译后的名字给管理员看
      const displayName = langData[cat.i18n] ? langData[cat.i18n].en : cat.i18n;

      let html = `
        <div class="cat-card">
          <div class="cat-header">
            <div>
              <span style="font-weight:bold; font-size:16px;">${displayName}</span>
              <select onchange="cpqData.catalog['${catKey}'].i18n = this.value; renderCPQ();">
                ${Object.keys(langData).map(k => `<option value="${k}" ${k===cat.i18n?'selected':''}>${k}</option>`).join('')}
              </select>
            </div>
            <div>
              <button class="btn btn-danger" onclick="deleteCat('${catKey}')">Delete Cat</button>
            </div>
          </div>
          <div class="item-list">`;
      
      for (let itemKey in cat.items) {
        html += `
          <div class="item-row">
            <input type="text" value="${itemKey}" readonly>
            <input type="number" value="${cat.items[itemKey]}" onchange="cpqData.catalog['${catKey}'].items['${itemKey}']=parseInt(this.value)">
            <button onclick="deleteItem('${catKey}','${itemKey}')">×</button>
          </div>`;
      }
      html += `</div><button class="btn btn-ghost" style="width:100%;" onclick="addItem('${catKey}')">+ Add Item</button></div>`;
      container.innerHTML += html;
    }
  }

  // --- Actions ---
  async function saveAll() {
    // 同步语言列表设置
    cpqData.settings.langs = document.getElementById('supported-langs').value.split(',').map(s => s.trim());
    
    const b1 = fetch(API + "?type=cpq", { method: "POST", body: JSON.stringify(cpqData) });
    const b2 = fetch(API + "?type=langs", { method: "POST", body: JSON.stringify(langData) });
    
    await Promise.all([b1, b2]);
    alert("System Configured & Translated! All changes live.");
  }

  function addTranslationKey() {
    const k = prompt("New Key (e.g. CAT_WASH):");
    if(k) { langData[k] = {}; renderLangs(); }
  }

  init();
</script>
</body>
</html>
